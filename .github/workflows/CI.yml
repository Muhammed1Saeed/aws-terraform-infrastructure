name: CI

on:
  push:
    branches: [ "*" ]

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: list
        run: ls

  build:

    runs-on: ubuntu-latest
    needs: checkout

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-app:$(date +%s)

  Test:
  
     runs-on: ubuntu-latest
     needs: build
  
     steps:
      - uses: actions/checkout@v7
      - name: Testing the Docker image
        run: echo "testing ========"
  
  Release:
  
     runs-on: ubuntu-latest
     needs: Test
  
     steps:
      - uses: actions/checkout@v7
      - name: Release the Docker image
        run: echo"release========="
